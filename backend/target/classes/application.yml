server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mom-baby-guide-backend
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/mombaby_guide?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    
  # Jackson配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# 日志配置
logging:
  level:
    com.mombaby: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# JWT配置
jwt:
  secret: momBabyGuideSecretKey2023ForJWTTokenGeneration
  expiration: 86400000  # 24小时 (毫秒)

# 文件上传配置
file:
  upload:
    path: /uploads/
    max-size: 10MB